<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#780018">
    <meta name="description" content="My latest YouTube Music listening card.">
    <title>YouTube Music Card</title><style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 0;
        background: #0d1117;
        color: #ffffff;
        font-family: Arial, sans-serif;
    }

    main {
        width: min(480px, calc(100% - 32px));
        text-align: center;
    }

    h1 {
        font-size: 22px;
        margin: 0 0 24px;
    }

    .card {
        display: block;
        width: 100%;
        border-radius: 14px;
        overflow: hidden;
    }

    .card img {
        display: block;
        width: 100%;
        height: auto;
    }

    .footer {
        margin-top: 20px;
        color: #8b949e;
        font-size: 12px;
    }

    a {
        color: #ff6b81;
        text-decoration: none;
    }

    .card:focus-visible {
        outline: 2px solid #ff6b81;
        outline-offset: 4px;
    }
</style>

</head><body>
    <main>
        <h1>YouTube Music</h1>    <a
        class="card"
        href="https://music.youtube.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open YouTube Music"
    >
        <img
            id="listening-card"
            src="/YTMusic-Widget/listening.svg"
            alt="YouTube Music Card"
        >
    </a>

    <div class="footer">
        Powered by YouTube Music
    </div>
</main>

<script>
    const card = document.getElementById("listening-card");
    const cardPath = "/YTMusic-Widget/listening.svg";

    function refreshCard() {
        card.src = `${cardPath}?t=${Date.now()}`;
    }

    // Refresh the card every 60 seconds.
    setInterval(refreshCard, 60000);
</script>

</body>
</html>
