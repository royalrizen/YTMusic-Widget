<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#780018">
    <title>YouTube Music Card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100% - 32px, 480px);
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 24px;
        }

        .card {
            width: 100%;
            display: block;
            border-radius: 14px;
            overflow: hidden;
        }

        .card img {
            display: block;
            width: 100%;
            height: auto;
        }

        .footer {
            margin-top: 20px;
            color: #8b949e;
            font-size: 12px;
        }

        a {
            color: #ff6b81;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>YouTube Music</h1>

        <a class="card"
           href="https://music.youtube.com/"
           target="_blank"
           rel="noopener noreferrer">
            <img id="listening-card"
                 src="./listening.svg"
                 alt="My YouTube Music listening card">
        </a>

        <div class="footer">
            Powered by YouTube Music
        </div>
    </main>

    <script>
        const card = document.getElementById("listening-card");

        function refreshCard() {
            card.src = "./listening.svg?t=" + Date.now();
        }

        setInterval(refreshCard, 60000);
    </script>
</body>
</html>
